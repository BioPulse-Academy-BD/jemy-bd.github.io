<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থী লগইন - BioPulse Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #002b22; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #004d40; border: 1px solid #00695c; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .form-control { background-color: #00332a; color: white; border: 1px solid #00695c; }
        .form-control:focus { background-color: #00332a; color: white; border-color: #ffc107; box-shadow: none; }
        .btn-login { background-color: #0d6efd; color: white; font-weight: bold; }
        .btn-register { background-color: #198754; color: white; font-weight: bold; }
        .btn-free { background-color: #ffc107; color: black; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <h3 class="text-center text-warning fw-bold mb-4">শিক্ষার্থী লগইন</h3>
                
                <div class="mb-3">
                    <label class="form-label">ইউজার আইডি (User ID)</label>
                    <input type="text" id="loginId" class="form-control" placeholder="আপনার আইডি লিখুন">
                </div>
                <div class="mb-3">
                    <label class="form-label">পাসওয়ার্ড (Password)</label>
                    <input type="password" id="loginPass" class="form-control" placeholder="পাসওয়ার্ড লিখুন">
                </div>
                
                <button onclick="loginUser()" class="btn btn-login w-100 py-2 mb-3">লগইন করুন</button>
                
                <div class="text-center border-top border-secondary pt-3 mt-2">
                    <p class="mb-2">নতুন শিক্ষার্থী?</p>
                    <a href="register.html" class="btn btn-register w-100 py-2 mb-3">নতুন অ্যাকাউন্ট খুলুন</a>
                    
                    <div class="d-flex align-items-center mb-3">
                        <hr class="flex-grow-1 border-secondary">
                        <span class="mx-2 text-muted">অথবা</span>
                        <hr class="flex-grow-1 border-secondary">
                    </div>

                    <a href="mcq.html" class="btn btn-free w-100 py-2">ফ্রি টেস্ট দিন (লগইন ছাড়া)</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function loginUser() {
        const id = document.getElementById('loginId').value.trim();
        const pass = document.getElementById('loginPass').value.trim();

        if(id === "" || pass === "") {
            alert("আইডি এবং পাসওয়ার্ড দুটোই দিন!");
            return;
        }

        // লোকাল স্টোরেজ থেকে ইউজার ডাটা চেক করা
        const users = JSON.parse(localStorage.getItem('biopulse_users')) || {};
        
        if(users[id] && users[id].password === pass) {
            // লগইন সফল
            localStorage.setItem('loggedInUser', id);
            alert("লগইন সফল হয়েছে! স্বাগতম " + users[id].name);
            window.location.href = "dashboard.html";
        } else {
            alert("ভুল আইডি বা পাসওয়ার্ড! আবার চেষ্টা করুন।");
        }
    }
</script>
</body>
</html>

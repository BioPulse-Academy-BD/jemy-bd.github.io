<script>
    const syllabusData = { /* আগের মতোই থাকবে */ };
    
    // ... (আগের ভেরিয়েবলগুলো) ...
    let timeLimit = 15 * 60; 
    let limitQuestions = 25;

    const urlParams = new URLSearchParams(window.location.search);
    const examType = urlParams.get('type'); // 'live', 'archive', 'model'
    const paramChapter = urlParams.get('chapter');
    const paramModel = urlParams.get('model');
    const archiveId = urlParams.get('id');

    window.onload = function() {
        if (examType === 'live') {
            timeLimit = 5 * 60;
            limitQuestions = 10;
            document.getElementById('examTitle').innerText = "লাইভ পরীক্ষা";
            document.getElementById('infoText').innerHTML = "<i class='bi bi-info-circle'></i> সময়: ৫ মিনিট | মোট প্রশ্ন: ১০টি";
            document.getElementById('selectionFields').classList.add('d-none');
            document.getElementById('timerDisplay').innerText = "05:00";
            document.getElementById('questionNumber').innerText = "প্রশ্ন ১ / ১০";
            fetchQuestions('questions.json', true); // লাইভের জন্য মেইন ফাইল থেকে র‍্যান্ডম
        } 
        else if (examType === 'archive') {
            timeLimit = 5 * 60; // আর্কাইভ লাইভ পরীক্ষার ছিল, তাই ৫ মিনিট
            limitQuestions = 10;
            document.getElementById('examTitle').innerText = "আর্কাইভ পরীক্ষা";
            document.getElementById('infoText').innerHTML = "<i class='bi bi-info-circle'></i> সময়: ৫ মিনিট | মোট প্রশ্ন: ১০টি";
            document.getElementById('selectionFields').classList.add('d-none');
            document.getElementById('timerDisplay').innerText = "05:00";
            document.getElementById('questionNumber').innerText = "প্রশ্ন ১ / ১০";
            fetchArchiveQuestions(archiveId);
        }
        else if (examType === 'model') {
            timeLimit = 15 * 60;
            limitQuestions = 25;
            document.getElementById('examTitle').innerText = "মডেল টেস্ট: " + paramChapter;
            document.getElementById('infoText').innerHTML = "<i class='bi bi-info-circle'></i> সময়: ১৫ মিনিট | মোট প্রশ্ন: ২৫টি";
            document.getElementById('selectionFields').classList.add('d-none');
            fetchQuestions('questions.json', false, paramChapter);
        }
        else {
            populateClasses();
            fetchQuestions('questions.json', false);
        }
    };

    function fetchQuestions(file, isRandom, chapterName = null) {
        fetch(file)
            .then(response => response.json())
            .then(data => { 
                allQuestions = data;
                if(isRandom) {
                    // লাইভ পরীক্ষার জন্য পুরো ফাইল থেকে ১০টি র‍্যান্ডম প্রশ্ন
                    let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
                    testQuestions = shuffled.slice(0, limitQuestions);
                    showStartForm("লাইভ পরীক্ষা");
                } else if (chapterName) {
                    // মডেল টেস্টের জন্য নির্দিষ্ট অধ্যায়
                    let filtered = allQuestions.filter(q => q.chapter === chapterName);
                    filtered.sort(() => Math.random() - 0.5);
                    testQuestions = filtered.slice(0, limitQuestions);
                    showStartForm(chapterName);
                }
            })
            .catch(error => { console.error("Error:", error); });
    }

    function fetchArchiveQuestions(id) {
        fetch('archive.json')
            .then(res => res.json())
            .then(data => {
                const exam = data.find(e => e.id === id);
                if(exam) {
                    testQuestions = exam.questions;
                    showStartForm(exam.name);
                } else {
                    alert("আর্কাইভ পাওয়া যায়নি!");
                }
            })
            .catch(err => alert("আর্কাইভ ফাইল লোড করা যায়নি!"));
    }

    // পরীক্ষা শুরু করার ফর্ম দেখানো (নাম নেওয়ার জন্য)
    function showStartForm(title) {
        document.getElementById('startArea').innerHTML = `
            <div class="col-md-8">
                <div class="card shadow p-4 text-center">
                    <h3 class="text-warning fw-bold mb-4">${title}</h3>
                    <div class="mb-3 text-start">
                        <label class="form-label fw-bold text-white">সার্টিফিকেটের জন্য নাম লিখুন:</label>
                        <input type="text" id="studentNameManual" class="form-control" placeholder="যেমন: রফিকুল ইসলাম">
                    </div>
                    <button class="btn btn-warning fw-bold w-100 py-2" onclick="startManualExam()">পরীক্ষা শুরু করুন</button>
                </div>
            </div>
        `;
    }

    function startManualExam() {
        studentName = document.getElementById('studentNameManual').value.trim();
        if(studentName === "") { alert("আপনার নাম লিখুন!"); return; }
        beginExam();
    }

    // সাধারণ ফ্রি MCQ এর জন্য (আগের কোড)
    function startExam() {
        studentName = document.getElementById('studentName').value.trim();
        const selectedChapter = document.getElementById('chapterSelect').value;
        if(studentName === "") { alert("নাম লিখুন!"); return; }
        if(selectedChapter === "") { alert("অধ্যায় সিলেক্ট করুন!"); return; }
        
        let filtered = allQuestions.filter(q => q.chapter === selectedChapter);
        filtered.sort(() => Math.random() - 0.5);
        testQuestions = filtered.slice(0, limitQuestions); 
        beginExam();
    }

    function beginExam() {
        userAnswers = new Array(testQuestions.length).fill(null);
        document.getElementById('startArea').classList.add('d-none');
        document.getElementById('examArea').classList.remove('d-none');
        createPalette();
        loadQuestion(0);
        startTimer();
    }
    
    // ... (বাকি টাইমার, লোডিং, সাবমিট ইত্যাদি কোড আগের মতোই থাকবে) ...
</script>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টপিক ভিত্তিক MCQ - BioPulse Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #004d40; }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand { color: white; }
        .navbar-custom .nav-link:hover { color: #ffc107; }
    </style>
</head>
<body class="bg-light">

    <!-- নেভিগেশন বার -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="Logo.jpg" alt="Logo" style="width: 40px; height: 40px; border-radius: 50%; background-color: white; margin-right: 10px;">
                <span>BioPulse Academy</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">হোম</a></li>
                    <li class="nav-item"><a class="nav-link active" href="mcq.html">ফ্রি MCQ</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="text-center text-success fw-bold mb-4">টপিক ভিত্তিক MCQ পরীক্ষা</h3>
        
        <!-- সিলেকশন এরিয়া -->
        <div id="selectionArea" class="row justify-content-center mb-4">
            <div class="col-md-8">
                
                <!-- ১. ক্লাস সিলেক্ট -->
                <div class="mb-3">
                    <label class="form-label fw-bold">১. শ্রেণি / কোর্স সিলেক্ট করুন:</label>
                    <select id="classSelect" class="form-select form-select-lg">
                        <option value="">-- বেছে নিন --</option>
                    </select>
                </div>

                <!-- ২. অধ্যায় সিলেক্ট -->
                <div class="mb-3 d-none" id="chapterDiv">
                    <label class="form-label fw-bold">২. অধ্যায় সিলেক্ট করুন:</label>
                    <select id="chapterSelect" class="form-select form-select-lg">
                        <option value="">-- অধ্যায় বেছে নিন --</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- কুইজ এরিয়া -->
        <div id="quizContainer" class="row justify-content-center d-none">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                            <span class="text-success fw-bold" id="topicTitle"></span>
                            <span class="text-muted fw-bold" id="progressText">প্রশ্ন ১ / ১০</span>
                        </div>
                        
                        <h5 id="questionText" class="mb-4 fw-bold"></h5>
                        <div id="optionsContainer" class="d-grid gap-2"></div>
                        
                        <button id="nextBtn" class="btn btn-warning mt-4 w-100 fw-bold py-2" onclick="checkAnswerAndNext()">পরবর্তী প্রশ্ন</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- রেজাল্ট এরিয়া -->
        <div id="resultContainer" class="row justify-content-center d-none">
            <div class="col-md-8 text-center">
                <div class="card shadow border-0 p-5">
                    <h2 class="text-success fw-bold mb-4">পরীক্ষা শেষ!</h2>
                    <h1 id="finalScore" class="display-1 fw-bold text-dark mb-4">০ / ১০</h1>
                    <p class="lead mb-4" id="resultMessage"></p>
                    <button class="btn btn-success fw-bold px-4 py-2" onclick="resetQuiz()">আবার পরীক্ষা দিন</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // আপনার সিলেবাস অনুযায়ী সম্পূর্ণ স্ট্রাকচার
        const syllabusData = {
            "নবম-দশম শ্রেণি": [
                "প্রথম অধ্যায়: জীবনপাঠ", "দ্বিতীয় অধ্যায়: জীবকোষ ও টিস্যু", "তৃতীয় অধ্যায়: কোষ বিভাজন",
                "চতুর্থ অধ্যায়: জীবশক্তি", "পঞ্চম অধ্যায়: খাদ্য, পুষ্টি এবং পরিপাক", "ষষ্ঠ অধ্যায়: জীবে পরিবহন",
                "সপ্তম অধ্যায়: গ্যাসীয় বিনিময়", "অষ্টম অধ্যায়: রেচন প্রক্রিয়া", "নবম অধ্যায়: দৃঢ়তা প্রদান ও চলন",
                "দশম অধ্যায়: সমন্বয়", "একাদশ অধ্যায়: জীবের প্রজনন", "দ্বাদশ অধ্যায়: জীবের বংশগতি ও জৈব বিবর্তন",
                "ত্রয়েদশ অধ্যায়: জীবের পরিবেশ", "চতুর্দশ অধ্যায়: জীবপ্রযুক্তি"
            ],
            "একাদশ শ্রেণি (উদ্ভিদবিজ্ঞান)": [
                "অধ্যায়-০১: কোষ ও এর গঠন", "অধ্যায়-০২: কোষ বিভাজন", "অধ্যায়-০৩: কোষ রসায়ন",
                "অধ্যায়-০৪: অণুজীব", "অধ্যায়-০৫: শৈবাল ও ছত্রাক", "অধ্যায়-০৬: ব্রায়োফাইটা ও টেরিডোফাইটা",
                "অধ্যায়-০৭: নগ্নবীজী ও আবৃতবীজী উদ্ভিদ", "অধ্যায়-০৮: টিস্যু ও টিস্যুতন্ত্র", "অধ্যায়-০৯: উদ্ভিদ শারীরতত্ত্ব",
                "অধ্যায়-১০: উদ্ভিদ প্রজনন", "অধ্যায়-১১: জীব প্রযুক্তি", "অধ্যায়-১২: জীবের পরিবেশ, বিস্তার ও সংরক্ষণ"
            ],
            "দ্বাদশ শ্রেণি (প্রাণীবিজ্ঞান)": [
                "অধ্যায়-০১: প্রাণির বিভিন্নতা ও শ্রেণিবিন্যাস", "অধ্যায়-০২.১: হাইড্রা", "অধ্যায়-০২.২: ঘাসফরিং",
                "অধ্যায়-০২.৩: রুই মাছ", "অধ্যায়-০৩: পরিপাক ও শোষণ", "অধ্যায়-০৪: রক্ত সংবহন",
                "অধ্যায়-০৫: শ্বসন ও শ্বাসক্রিয়া", "অধ্যায়-০৬: বর্জ্য ও নিষ্কাশন", "অধ্যায়-০৭: চলন ও অঙ্গচালনা",
                "অধ্যায়-০৮: সমন্বয় ও নিয়ন্ত্রণ", "অধ্যায়-০৯: মানব জীবনের ধারাবাহিকতা", "অধ্যায়-১০: মানবদেহের প্রতিরক্ষা",
                "অধ্যায়-১১: জিনতত্ত্ব ও বিবর্তন", "অধ্যায়-১২: প্রাণির আচরণ"
            ],
            "মেডিকেল অ্যাডমিশন": [
                "কোষ ও এর গঠন", "কোষ বিভাজন", "কোষ রসায়ন", "অণুজীব", "শৈবাল ও ছত্রাক",
                "ব্রায়োফাইটা ও টেরিডোফাইটা", "নগ্নবীজী ও আবৃতবীজী উদ্ভিদ", "টিস্যু ও টিস্যুতন্ত্র",
                "উদ্ভিদ শারীরতত্ত্ব", "প্রাণির বিভিন্নতা ও শ্রেণিবিন্যাস", "পরিপাক ও শোষণ", "রক্ত সংবহন",
                "শ্বসন ও শ্বাসক্রিয়া", "বর্জ্য ও নিষ্কাশন", "চলন ও অঙ্গচালনা", "সমন্বয় ও নিয়ন্ত্রণ",
                "জিনতত্ত্ব ও বিবর্তন"
            ],
            "ভার্সিটি অ্যাডমিশন": [
                "কোষ ও এর গঠন", "কোষ বিভাজন", "কোষ রসায়ন", "অণুজীব", "শৈবাল ও ছত্রাক",
                "ব্রায়োফাইটা ও টেরিডোফাইটা", "নগ্নবীজী ও আবৃতবীজী উদ্ভিদ", "টিস্যু ও টিস্যুতন্ত্র",
                "উদ্ভিদ শারীরতত্ত্ব", "প্রাণির বিভিন্নতা ও শ্রেণিবিন্যাস", "পরিপাক ও শোষণ", "রক্ত সংবহন",
                "শ্বসন ও শ্বাসক্রিয়া", "বর্জ্য ও নিষ্কাশন", "চলন ও অঙ্গচালনা", "সমন্বয় ও নিয়ন্ত্রণ",
                "জিনতত্ত্ব ও বিবর্তন"
            ]
        };

        let allQuestions = [];
        let testQuestions = []; 
        let currentQuestionIndex = 0;
        let score = 0;
        let selectedOption = null;

        window.onload = function() {
            populateClasses();
            
            // JSON ডেটা লোড করা
            fetch('questions.json')
                .then(response => response.json())
                .then(data => {
                    allQuestions = data;
                })
                .catch(error => {
                    console.error("Error loading:", error);
                });
        };

        // ১. ক্লাস ড্রপডাউন তৈরি (আমাদের সিলেবাস থেকে)
        function populateClasses() {
            const classSelect = document.getElementById('classSelect');
            Object.keys(syllabusData).forEach(cls => {
                const option = document.createElement('option');
                option.value = cls;
                option.textContent = cls;
                classSelect.appendChild(option);
            });
        }

        // ২. ক্লাস সিলেক্ট করলে অধ্যায় দেখানো
        document.getElementById('classSelect').addEventListener('change', function() {
            const selectedClass = this.value;
            const chapterSelect = document.getElementById('chapterSelect');
            const chapterDiv = document.getElementById('chapterDiv');

            chapterSelect.innerHTML = '<option value="">-- অধ্যায় বেছে নিন --</option>';

            if(selectedClass === "") {
                chapterDiv.classList.add('d-none');
                return;
            }

            // সিলেবাস থেকে অধ্যায়গুলো নেওয়া
            const chapters = syllabusData[selectedClass];
            chapters.forEach(chap => {
                const option = document.createElement('option');
                option.value = chap;
                option.textContent = chap;
                chapterSelect.appendChild(option);
            });

            chapterDiv.classList.remove('d-none');
        });

        // ৩. অধ্যায় সিলেক্ট করলে পরীক্ষা শুরু
        document.getElementById('chapterSelect').addEventListener('change', function() {
            const selectedClass = document.getElementById('classSelect').value;
            const selectedChapter = this.value;

            if(selectedChapter === "") return;

            // JSON ফাইল থেকে এই নির্দিষ্ট ক্লাস ও অধ্যায়ের প্রশ্ন খোঁজা
            // (এখানে আমরা class এবং chapter দুটোই মিলিয়ে দেখছি)
            let filteredQuestions = allQuestions.filter(q => q.class === selectedClass && q.chapter === selectedChapter);
            
            // যদি এই অধ্যায়ে প্রশ্ন না থাকে
            if(filteredQuestions.length === 0) {
                alert("দুঃখিত, '" + selectedChapter + "' অধ্যায়ের প্রশ্ন এখনো যুক্ত করা হয়নি। খুব শীঘ্রই যুক্ত করা হবে!");
                this.value = ""; // সিলেকশন রিসেট
                return;
            }

            // প্রশ্ন শাফল করা (র‍্যান্ডম)
            filteredQuestions.sort(() => Math.random() - 0.5);
            testQuestions = filteredQuestions.slice(0, 10); // সর্বোচ্চ ১০টি
            
            document.getElementById('selectionArea').classList.add('d-none');
            document.getElementById('quizContainer').classList.remove('d-none');
            document.getElementById('resultContainer').classList.add('d-none');
            document.getElementById('topicTitle').innerText = selectedChapter;
            
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        });

        function loadQuestion() {
            selectedOption = null; 
            const q = testQuestions[currentQuestionIndex];
            
            document.getElementById('progressText').innerText = "প্রশ্ন " + (currentQuestionIndex + 1) + " / " + testQuestions.length;
            document.getElementById('questionText').innerText = q.question;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "btn btn-outline-secondary text-start p-3";
                btn.innerHTML = `<strong>${index + 1}.</strong> ${opt}`;
                
                btn.onclick = function() {
                    Array.from(optionsContainer.children).forEach(b => b.className = "btn btn-outline-secondary text-start p-3");
                    btn.className = "btn btn-primary text-start p-3 text-white";
                    selectedOption = index;
                };
                optionsContainer.appendChild(btn);
            });

            if(currentQuestionIndex === testQuestions.length - 1) {
                document.getElementById('nextBtn').innerText = "ফলাফল দেখুন";
            } else {
                document.getElementById('nextBtn').innerText = "পরবর্তী প্রশ্ন";
            }
        }

        function checkAnswerAndNext() {
            if(selectedOption === null) {
                alert("অনুগ্রহ করে একটি অপশন সিলেক্ট করুন!");
                return;
            }

            if(selectedOption === testQuestions[currentQuestionIndex].answer) {
                score++;
            }

            currentQuestionIndex++;

            if(currentQuestionIndex < testQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quizContainer').classList.add('d-none');
            document.getElementById('resultContainer').classList.remove('d-none');
            
            const bnNumbers = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
            let scoreBn = score.toString().split('').map(d => bnNumbers[d]).join('');
            let totalBn = testQuestions.length.toString().split('').map(d => bnNumbers[d]).join('');

            document.getElementById('finalScore').innerText = scoreBn + " / " + totalBn;
            
            const message = document.getElementById('resultMessage');
            if(score === testQuestions.length) {
                message.innerText = "অসাধারণ! সব উত্তর সঠিক হয়েছে। 🌟";
            } else if (score >= testQuestions.length / 2) {
                message.innerText = "ভালো করেছ! আরও প্র্যাকটিস করলে আরও ভালো হবে। 💪";
            } else {
                message.innerText = "আরও পড়াশোনা প্রয়োজন। হাল ছেড়ে দিও না! 📚";
            }
        }

        function resetQuiz() {
            document.getElementById('resultContainer').classList.add('d-none');
            document.getElementById('selectionArea').classList.remove('d-none');
            document.getElementById('classSelect').value = '';
            document.getElementById('chapterSelect').innerHTML = '<option value="">-- অধ্যায় বেছে নিন --</option>';
            document.getElementById('chapterDiv').classList.add('d-none');
        }
    </script>
</body>
</html>

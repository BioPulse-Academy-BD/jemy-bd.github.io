<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম নোটস - BioPulse Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #002b22; color: white; font-family: 'Segoe UI', sans-serif; }
        .navbar-custom { background-color: #004d40; }
        .navbar-custom .nav-link, .navbar-custom .navbar-brand { color: white; }
        .card { background-color: #004d40; border: 1px solid #00695c; border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">← ড্যাশবোর্ডে ফিরে যান</a>
        </div>
    </nav>

    <div class="container pb-5">
        <h2 class="text-warning fw-bold text-center mb-4"><i class="bi bi-file-earmark-pdf"></i> প্রিমিয়াম নোটস ও পিডিএফ</h2>
        
        <div class="row" id="notesContainer">
            <!-- জাভাস্ক্রিপ্ট দিয়ে নোটসের কার্ড তৈরি হবে -->
        </div>
    </div>

    <script>
        // পেজ লোড হলে চেক করুন লগইন করা আছে কিনা
        const currentUser = localStorage.getItem('loggedInUser');
        if (!currentUser) {
            alert("নোটস দেখতে অনুগ্রহ করে লগইন করুন!");
            window.location.href = "login.html";
        }

        // notes.json থেকে ডেটা লোড করা
        fetch('notes.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('notesContainer');
                if(data.length === 0) {
                    container.innerHTML = '<p class="text-center text-white">এখনো কোনো নোট আপলোড করা হয়নি।</p>';
                    return;
                }
                data.forEach(note => {
                    container.innerHTML += `
                        <div class="col-md-4 mb-4">
                            <div class="card p-4 h-100 text-center">
                                <h4 class="text-warning fw-bold">${note.title}</h4>
                                <p class="text-white">${note.description}</p>
                                <div class="mt-auto">
                                    <a href="${note.file}" target="_blank" class="btn btn-success w-100 fw-bold mb-2">অনলাইনে পড়ুন</a>
                                    <a href="${note.file}" download class="btn btn-outline-warning w-100 fw-bold">ডাউনলোড করুন</a>
                                </div>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('notesContainer').innerHTML = '<p class="text-center text-danger">নোটস লোড করতে সমস্যা হচ্ছে।</p>';
            });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শিক্ষার্থী রেজিস্ট্রেশন - BioPulse Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #002b22; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #004d40; border: 1px solid #00695c; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .form-control, .form-select { background-color: #00332a; color: white; border: 1px solid #00695c; }
        .form-control:focus, .form-select:focus { background-color: #00332a; color: white; border-color: #ffc107; box-shadow: none; }
        option { background-color: #00332a; color: white; }
        .btn-register { background-color: #198754; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4">
                <h3 class="text-center text-warning fw-bold mb-2">শিক্ষার্থী রেজিস্ট্রেশন ফর্ম</h3>
                <p class="text-center text-muted mb-4">BioPulse Academy - আপনার পছন্দের আইডি ও পাসওয়ার্ড দিয়ে ফর্মটি পূরণ করুন</p>
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">শিক্ষার্থীর পূর্ণ নাম *</label>
                        <input type="text" id="regName" class="form-control" placeholder="যেমন: মোঃ আল-আমিন" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">পছন্দের ইউজার আইডি (User ID) *</label>
                        <input type="text" id="regId" class="form-control" placeholder="যেমন: alamin2026" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">পছন্দের পাসওয়ার্ড (Password) *</label>
                        <input type="password" id="regPass" class="form-control" placeholder="একটি গোপন পাসওয়ার্ড দিন" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">মোবাইল নম্বর *</label>
                        <input type="text" id="regMobile" class="form-control" placeholder="017XXXXXXXX" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">পিতার নাম</label>
                        <input type="text" id="regFather" class="form-control" placeholder="পিতার নাম লিখুন">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">মাতার নাম</label>
                        <input type="text" id="regMother" class="form-control" placeholder="মাতার নাম লিখুন">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">কলেজ / প্রতিষ্ঠান</label>
                        <input type="text" id="regCollege" class="form-control" placeholder="যেমন: শলুয়া ডিগ্রি কলেজ">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">এইচএসসি ব্যাচ</label>
                        <select id="regBatch" class="form-select">
                            <option value="">ব্যাচ নির্বাচন করুন</option>
                            <option value="2024">2024</option>
                            <option value="2025">2025</option>
                            <option value="2026">2026</option>
                        </select>
                    </div>

                    <div class="col-12 mb-4">
                        <label class="form-label">বর্তমান ঠিকানা</label>
                        <textarea id="regAddress" class="form-control" rows="2" placeholder="গ্রাম/মহল্লা, ডাকঘর, উপজেলা, জেলা"></textarea>
                    </div>
                </div>

                <button onclick="registerUser()" class="btn btn-register w-100 py-2">রেজিস্ট্রেশন সম্পন্ন করুন</button>
                <div class="text-center mt-3">
                    <a href="login.html" class="text-warning text-decoration-none">আগে থেকেই অ্যাকাউন্ট আছে? লগইন করুন</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function registerUser() {
        const name = document.getElementById('regName').value.trim();
        const id = document.getElementById('regId').value.trim();
        const pass = document.getElementById('regPass').value.trim();
        const mobile = document.getElementById('regMobile').value.trim();
        const father = document.getElementById('regFather').value.trim();
        const mother = document.getElementById('regMother').value.trim();
        const college = document.getElementById('regCollege').value.trim();
        const batch = document.getElementById('regBatch').value;
        const address = document.getElementById('regAddress').value.trim();

        if(name === "" || id === "" || pass === "" || mobile === "") {
            alert("তারকা (*) চিহ্নিত ঘরগুলো অবশ্যই পূরণ করতে হবে!");
            return;
        }

        // লোকাল স্টোরেজে ইউজার ডাটা সেভ করা
        let users = JSON.parse(localStorage.getItem('biopulse_users')) || {};

        if(users[id]) {
            alert("এই ইউজার আইডিটি আগেই ব্যবহার করা হয়েছে! অন্য আইডি দিন।");
            return;
        }

        users[id] = { name, password: pass, mobile, father, mother, college, batch, address };
        localStorage.setItem('biopulse_users', JSON.stringify(users));

        alert("রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন।");
        window.location.href = "login.html";
    }
</script>
</body>
</html>
